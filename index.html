<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050712">
  <meta name="description" content="AURA VPN">
  <title>AURA VPN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div class="brand__name">AURA <span>VPN</span></div>
      <div class="brand__caption">Безопасный интернет</div>
    </header>

    <section class="hero" aria-labelledby="title">
      <div class="status" id="statusText">Не подключено</div>
      <p class="eyebrow">AURA NETWORK</p>
      <h1 id="title">Защити своё<br><span>подключение</span></h1>
      <p class="subtitle">Скорость, приватность и свобода — в один клик.</p>

      <button class="connect" id="connectBtn" type="button">
        <span id="connectLabel">Подключиться</span>
      </button>

      <button class="tariff-main" id="tariffBtn" type="button">Выбрать тариф</button>
    </section>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__backdrop" data-close="1"></div>
    <section class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__step" id="modalStep"></div>
      <h2 id="modalTitle">AURA VPN</h2>
      <div class="modal__body" id="modalBody"></div>
      <div class="modal__actions" id="modalActions"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
